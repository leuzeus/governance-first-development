name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository checks
        run: python -X utf8 scripts/validate_repository.py
      - name: Validate attempt outcome examples
        run: python -X utf8 scripts/validate_attempt_governance.py --records examples/attempt-lineage
      - name: Run executable governance tests
        run: python -X utf8 -m unittest discover -s tests -v
